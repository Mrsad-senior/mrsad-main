[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mirsad"
version = "1.0.0"
description = "Mirsad (مرصاد): a runtime security firewall for AI agents against prompt-injection attacks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Mohammed Yasser Alanssari" },
  { name = "Bader Alshuraie" },
  { name = "Bader Abdullah Abbod Alyamini" },
  { name = "Abdulmalik bin Saedan" },
  { name = "Abdullah Naif Abdullah Al-Orabi" },
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "mcp>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "pyjwt>=2.9",
  "sse-starlette>=2.1",
  "click>=8.1",
  "pywebpush>=2.0",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]
postgres = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "matplotlib>=3.9",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "playwright>=1.47",
  "schemathesis>=3.34",
  "psycopg[binary]>=3.2",
  "pgserver>=0.1",
]

[project.scripts]
mirsad = "mirsad.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mirsad", "demo", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
  "llm: tests that need a running Ollama model (deselect with -m 'not llm')",
  "slow: slow tests",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "demo", "bench", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "E501", "UP042"]  # str+Enum kept deliberately: stable str() for pydantic models

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"bench/**" = ["S311"]
"demo/**" = ["S311"]

[tool.coverage.run]
source = ["mirsad"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
