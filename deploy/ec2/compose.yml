# EC2 additions to docker-compose.yml (see docs/DEPLOY_EC2.md): the gateway uses Supabase Postgres
# (MIRSAD_DATABASE_URL), so the local db service is not started; a Cloudflare Tunnel carries
# api.mirsad-app.com to the gateway, so the server opens no web ports; the gateway port is
# reachable only from the server itself.
# Selected through COMPOSE_FILE in .env. Each service gets only the .env values it needs (the
# tunnel token stays with cloudflared): add any further MIRSAD_ setting under mirsad.environment.
services:
  mirsad:
    ports: !override
      - "127.0.0.1:8700:8700"
    depends_on: !reset {}
    # The image installs mirsad into site-packages, so the gateway looks for configs/ two levels
    # above the package (policy, upstreams, sector demo policy), not in /app: mount it there.
    volumes:
      - ./configs:/usr/local/lib/python3.12/configs:ro
    environment:
      MIRSAD_DATABASE_URL: ${MIRSAD_DATABASE_URL:?set MIRSAD_DATABASE_URL in .env}
      MIRSAD_CORS_ORIGINS: ${MIRSAD_CORS_ORIGINS:?set MIRSAD_CORS_ORIGINS in .env}
      MIRSAD_ADMIN_USERNAME: ${MIRSAD_ADMIN_USERNAME:-admin}
      MIRSAD_LOG_LEVEL: ${MIRSAD_LOG_LEVEL:-INFO}
      MIRSAD_APPROVAL_TIMEOUT_S: ${MIRSAD_APPROVAL_TIMEOUT_S:-120}
      MIRSAD_SEMANTIC_ENABLED: ${MIRSAD_SEMANTIC_ENABLED:-0}
      MIRSAD_JUDGE_ENABLED: ${MIRSAD_JUDGE_ENABLED:-0}
      MIRSAD_JUDGE_BASE_URL: ${MIRSAD_JUDGE_BASE_URL:-}
      MIRSAD_JUDGE_API_KEY: ${MIRSAD_JUDGE_API_KEY:-}
      MIRSAD_JUDGE_MODEL: ${MIRSAD_JUDGE_MODEL:-qwen2.5:3b}
      MIRSAD_JUDGE_EXTRACTION: ${MIRSAD_JUDGE_EXTRACTION:-flag}
      MIRSAD_INTENT_JUDGE_ENABLED: ${MIRSAD_INTENT_JUDGE_ENABLED:-0}
      # Demo agent and the /v1 proxy: any OpenAI-compatible API (base URL ending in /v1). No Ollama
      # service runs here, so these replace the base file's http://ollama:11434/v1.
      MIRSAD_LLM_BASE_URL: ${MIRSAD_LLM_BASE_URL:?set MIRSAD_LLM_BASE_URL in .env}
      MIRSAD_LLM_MODEL: ${MIRSAD_LLM_MODEL:?set MIRSAD_LLM_MODEL in .env}
      MIRSAD_LLM_API_KEY: ${MIRSAD_LLM_API_KEY:-}
      MIRSAD_VAPID_PUBLIC_KEY: ${MIRSAD_VAPID_PUBLIC_KEY:-}
      MIRSAD_VAPID_PRIVATE_KEY: ${MIRSAD_VAPID_PRIVATE_KEY:-}
  db:
    profiles: ["local-db"]   # never started here: the gateway uses Supabase Postgres
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - mirsad
