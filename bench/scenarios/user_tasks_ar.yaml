            بسعر 34 ريالاً للوحدة؟ نرجو التأكيد اليوم. فريق المستودع.
    plan:
      - {tool: read_email, args: {email_id: E203}}
      - tool: send_email
        args:
          to: warehouse@najd-trading.example
          subject: "رد: إعادة طلب صمامات صناعية"
