- key: li2025piguard
  ieee: 'H. Li, X. Liu, N. Zhang, and C. Xiao, "PIGuard: Prompt injection guardrail via mitigating overdefense for free," in Proc. 63rd Annu. Meeting Assoc. Comput. Linguistics (Vol. 1: Long Papers), Vienna, Austria, Jul. 2025, pp. 30420-30437, doi: 10.18653/v1/2025.acl-long.1468.'
  url: https://aclanthology.org/2025.acl-long.1468/
