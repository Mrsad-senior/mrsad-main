  relevance: False positives become needless mobile approval requests, so Mirsad should build an Arabic NotInject-style benign set. PIGuard was the most resistant detector in Nasr et al. (71% ASR).
- key: liu2023houyi
  ieee: 'Y. Liu et al., "Prompt injection attack against LLM-integrated applications," arXiv:2306.05499, 2023. [Online]. Available: https://arxiv.org/abs/2306.05499'
  url: https://arxiv.org/abs/2306.05499
  track: attacks-benchmarks
  summary: After finding that existing injection strategies had limited success against 10 commercial apps, the authors propose HouYi, a black-box attack with a pre-constructed prompt, a context-partition injection and a malicious payload. HouYi found 31 of 36 real LLM apps vulnerable, and 10 vendors (including Notion) confirmed the findings. Impacts include prompt theft and unrestricted LLM use.
  relevance: Context-partition patterns are a detector feature class for Mirsad. Prompt theft motivates policies that keep system-prompt text out of outbound tool arguments.
- key: liu2024formalizing
  ieee: Y. Liu, Y. Jia, R. Geng, J. Jia, and N. Z. Gong, "Formalizing and benchmarking prompt injection attacks and defenses," in Proc. 33rd USENIX Security Symp. (USENIX Security 24), Philadelphia, PA, USA, Aug. 2024, pp. 1831-1847.
  url: https://www.usenix.org/conference/usenixsecurity24/presentation/liu-yupei
  track: defenses
  summary: Formal framework for prompt injection and a benchmark of 5 attacks x 10 defenses x 10 LLMs x 7 tasks. The defenses are five prevention defenses (paraphrasing, retokenization, delimiters, sandwich, instructional) and five detection defenses (PPL, windowed PPL, naive LLM-based, response-based, known-answer). Prevention is weak or costly, most detectors miss attacks or flag clean data, and known-answer detection is the most effective detector.
  relevance: Baseline definitions and defense taxonomy for the report's background. Known-answer detection relates to Mirsad's canary idea.
