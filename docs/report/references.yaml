  ieee: M. Costa et al., "Securing AI agents with information-flow control," arXiv:2505.23643, May 2025.
  url: https://arxiv.org/abs/2505.23643
  track: defenses
  summary: Formal IFC model for agent planners plus FIDES, which labels data with integrity and confidentiality, propagates labels conservatively, and enforces trusted-action and permitted-flow policies at tool calls. It hides results in variables and uses a constrained quarantined LLM with low-capacity outputs. On AgentDojo it prevents all attacks except text-to-text and one calendar case, and it aborts on violation, citing confirmation fatigue as the reason to avoid human prompts.
  relevance: Theoretical basis for Mirsad's taint tracking. Mirsad can adopt its consequential/egress tool classification and route violations to human approval instead of aborting.
- key: crosby2009efficient
  ieee: S. A. Crosby and D. S. Wallach, "Efficient data structures for tamper-evident logging," in Proc. 18th USENIX Secur. Symp., Montreal, QC, Canada, Aug. 2009.
  url: https://www.usenix.org/conference/usenixsecurity09/technical-sessions/presentation/efficient-data-structures-tamper-evident
  track: foundations
  summary: 'Defines tamper evidence through auditor challenges (membership and consistency proofs) and introduces a Merkle-tree history tree with logarithmic proofs: a 3 KB proof versus an ~800 MB hash-chain trace to prove membership of a random event in an 80M-event log. Also supports authenticated search and agreed-upon deletion, and reports 1,750 events/s on one core (10,500 events/s with signatures offloaded).'
  relevance: Gives the vocabulary for Mirsad's audit verification and a scalable upgrade path from the linear chain.
- key: debenedetti2024agentdojo
  ieee: 'E. Debenedetti, J. Zhang, M. Balunović, L. Beurer-Kellner, M. Fischer, and F. Tramèr, "AgentDojo: A dynamic environment to evaluate prompt injection attacks and defenses for LLM agents," in Adv. Neural Inf. Process. Syst. 37 (NeurIPS 2024), Datasets and Benchmarks Track, 2024, pp. 82895-82920, doi: 10.52202/079017-2636.'
  url: https://proceedings.neurips.cc/paper_files/paper/2024/hash/97091a5177d8dc64b1da8bf3e1f6fb54-Abstract-Datasets_and_Benchmarks_Track.html
  track: attacks-benchmarks
  summary: Extensible stateful environment with 4 suites (Workspace, Slack, Travel, Banking), 97 user tasks and 629 security cases. GPT-4o targeted ASR under the 'important message' attack is about 48-58% depending on the table. A tool-filter defense cut ASR to about 7% while keeping benign utility (73% vs 69%). A PI detector reached similar security (about 8%) but cut benign utility from 69% to about 41% (and utility under attack from 50% to 21%).
  relevance: Primary recommended evaluation harness for Mirsad, using utility, utility under attack and ASR. The detector false-positive result shapes how Mirsad's detector should be tuned, and the tool-filter result supports least-privilege policy.
- key: debenedetti2025camel
  ieee: E. Debenedetti et al., "Defeating prompt injections by design," arXiv:2503.18813, Mar. 2025 (v2, Jun. 2025).
  url: https://arxiv.org/abs/2503.18813
  track: defenses
  summary: 'CaMeL: a privileged LLM writes restricted Python from the trusted query, and a tool-less quarantined LLM parses untrusted data. A custom interpreter tracks data flow and capabilities and checks Python security policies before each tool call. Solves 77% of AgentDojo tasks with provable security (versus 84% undefended). Median token overhead is about 2.82x input and 2.73x output. In real deployments, violations are meant to require user confirmation rather than be blocked.'
  relevance: The gold-standard comparison. Mirsad brings its provenance-and-policy ideas to unmodified agents at the MCP boundary, with coarser taint.
- key: deng2024multilingual
  ieee: 'Y. Deng, W. Zhang, S. J. Pan, and L. Bing, "Multilingual jailbreak challenges in large language models," in Proc. 12th Int. Conf. Learn. Represent. (ICLR), 2024. [Online]. Available: https://arxiv.org/abs/2310.06474'
  url: https://arxiv.org/abs/2310.06474
  track: multilingual-arabic-security-and-standards
  summary: Separates unintentional and intentional multilingual jailbreaks and introduces MultiJail (315 prompts in 9 languages, Arabic among them). Intentional attacks reached 80.92% unsafe output on ChatGPT and 40.71% on GPT-4. Proposes Self-Defense fine-tuning.
  relevance: Human-translated Arabic test data. Benign Arabic traffic must not be over-blocked.
- key: denning1976lattice
  ieee: 'D. E. Denning, "A lattice model of secure information flow," Commun. ACM, vol. 19, no. 5, pp. 236–243, May 1976, doi: 10.1145/360051.360056.'
  url: https://doi.org/10.1145/360051.360056
  track: foundations
  summary: Models security classes as a lattice with a can-flow relation and a join operator. A flow is secure only if it respects the class ordering. The model covers explicit and implicit flows and leads to automatic certification of program flows.
  relevance: 'Theoretical basis for Mirsad''s taint labels: joining the labels of the agent''s context sets the label of a tool argument. Label creep is the reason human declassification is needed.'
