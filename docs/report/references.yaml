  ieee: P. Theocharopoulos, A. Kulkarni, and M. Magimai.-Doss, "Multilingual hidden prompt injection attacks on LLM-based academic reviewing," arXiv:2512.23684, Dec. 2025.
  url: https://arxiv.org/abs/2512.23684
  track: multilingual-arabic-security-and-standards
  summary: Hidden injections in about 500 ICML papers. English, Japanese and Chinese injections changed LLM reviews substantially; Arabic injections had little or no effect.
  relevance: One of the few indirect-injection studies that includes Arabic. Arabic risk tracks how well the model follows Arabic instructions.
- key: toyer2024tensortrust
  ieee: 'S. Toyer, O. Watkins, E. Mendes, J. Svegliato, L. Bailey, T. Wang, I. Ong, K. Elmaaroufi, P. Abbeel, T. Darrell, A. Ritter, and S. Russell, "Tensor Trust: Interpretable prompt injection attacks from an online game," in Proc. 12th Int. Conf. Learn. Represent. (ICLR), 2024. [Online]. Available: https://proceedings.iclr.cc/paper_files/paper/2024/hash/519c51529c3544b3430bd8b17d400365-Abstract-Conference.html'
  url: https://proceedings.iclr.cc/paper_files/paper/2024/hash/519c51529c3544b3430bd8b17d400365-Abstract-Conference.html
  track: attacks-benchmarks
  summary: An online game that collected over 563,000 human-written injection attacks and 118,000 defenses (ICLR version), described as the first dataset with both human-generated attacks and defenses. The authors build prompt-extraction and prompt-hijacking robustness benchmarks and find interpretable strategies, some of which transfer to deployed apps.
  relevance: Labeled English injection data for training and testing Mirsad's detector. It has no Arabic counterpart, which is a gap Mirsad can address.
- key: vassilev2025ai1002
  ieee: 'A. Vassilev, A. Oprea, A. Fordyce, H. Anderson, X. Davies, and M. Hamin, "Adversarial machine learning: A taxonomy and terminology of attacks and mitigations," National Institute of Standards and Technology, Gaithersburg, MD, USA, NIST AI 100-2e2025, Mar. 2025, doi: 10.6028/NIST.AI.100-2e2025.'
  url: https://csrc.nist.gov/pubs/ai/100/2/e2025/final
  track: multilingual-arabic-security-and-standards
  summary: AML taxonomy for predictive and generative AI. Section 3.4 covers indirect prompt injection and its mitigations; Section 3.5 covers agent security; translation into less common languages is listed as a jailbreak technique.
  relevance: Authoritative terminology. Endorses designing as if injection will happen.
- key: vassilev2025nistaml
  ieee: 'A. Vassilev, A. Oprea, A. Fordyce, H. Anderson, X. Davies, and M. Hamin, "Adversarial machine learning: A taxonomy and terminology of attacks and mitigations," National Institute of Standards and Technology, Gaithersburg, MD, USA, NIST AI 100-2e2025, Mar. 2025, doi: 10.6028/NIST.AI.100-2e2025.'
  url: https://csrc.nist.gov/pubs/ai/100/2/e2025/final
  track: multilingual-arabic-security-and-standards
  summary: ''
  relevance: ''
- key: w3c2023wcag22
  ieee: 'A. Campbell, C. Adams, R. B. Montgomery, M. Cooper, and A. Kirkpatrick, Eds., "Web Content Accessibility Guidelines (WCAG) 2.2," W3C Recommendation, Oct. 5, 2023 (updated Dec. 12, 2024). Accessed: Oct. 11, 2026. [Online]. Available: https://www.w3.org/TR/WCAG22/'
  url: https://www.w3.org/TR/WCAG22/
  track: foundations
  summary: Testable accessibility success criteria under four principles (perceivable, operable, understandable, robust) and three conformance levels. Adds 9 criteria over 2.1 (e.g., Target Size Minimum, Accessible Authentication, Focus Not Obscured) and removes 4.1.1 Parsing.
  relevance: Mirsad's approval app should target Level AA, especially target size for approve/deny, accessible login, and correct lang/dir for Arabic/English.
- key: w3c_appmanifest
  ieee: 'M. Cáceres, D. Murphy, and C. Liebel, Eds., "Web Application Manifest," W3C Working Draft, Oct. 9, 2026. Accessed: Oct. 11, 2026. [Online]. Available: https://www.w3.org/TR/appmanifest/'
  url: https://www.w3.org/TR/appmanifest/
  track: foundations
  summary: JSON manifest that centralizes web-app metadata (names, icons, start_url, display, scope, orientation, colours, shortcuts, lang/dir) so the app can be installed and presented like a native app. start_url is purely advisory.
  relevance: Mirsad's approval page links a web manifest, letting approvers install it as a PWA without app stores. Its lang/dir members matter for the bilingual UI.
- key: w3c_serviceworkers
  ieee: 'M. Chintala and Y. Yanagisawa, Eds., "Service Workers Nightly," W3C Candidate Recommendation Draft, Sep. 17, 2026. Accessed: Oct. 11, 2026. [Online]. Available: https://www.w3.org/TR/service-workers/'
  url: https://www.w3.org/TR/service-workers/
  track: foundations
  summary: Event-driven workers scoped to an origin and path that intercept fetches, serve from a programmable cache, receive push and other functional events, may be terminated when idle, and are restricted to secure contexts.
  relevance: Enables push notifications for pending approvals. Approval and decision API responses must never be served from cache, consistent with Mirsad's worker-src 'self' and no-store headers.
- key: wallace2024instruction
  ieee: 'E. Wallace, K. Xiao, R. Leike, L. Weng, J. Heidecke, and A. Beutel, "The instruction hierarchy: Training LLMs to prioritize privileged instructions," arXiv:2404.13208, 2024. [Online]. Available: https://arxiv.org/abs/2404.13208'
  url: https://arxiv.org/abs/2404.13208
  track: attacks-benchmarks
  summary: Argues that models often give system prompts the same priority as text from users and third parties. Proposes an instruction hierarchy and a synthetic-data training method that teaches GPT-3.5 to ignore conflicting lower-privilege instructions, improving robustness (including to unseen attacks) with minimal capability loss.
  relevance: Model-side counterpart of Mirsad's taint labels. Mirsad enforces the same priority deterministically at the tool layer for any model.
- key: wallace2024instructionhierarchy
  ieee: 'E. Wallace, K. Xiao, R. Leike, L. Weng, J. Heidecke, and A. Beutel, "The instruction hierarchy: Training LLMs to prioritize privileged instructions," arXiv:2404.13208, Apr. 2024.'
  url: https://arxiv.org/abs/2404.13208
  track: defenses
  summary: Argues that models treat system prompts and untrusted text with equal priority. Defines an instruction hierarchy and a data-generation method that teaches the model to ignore lower-privileged conflicting instructions. Applied to GPT-3.5, robustness rises sharply, even on unseen attack types, with minimal capability loss.
  relevance: Conceptual basis for Mirsad's trust levels, which Mirsad enforces outside the model at the tool boundary.
- key: wang2026agentspec
  ieee: 'H. Wang, C. M. Poskitt, and J. Sun, "AgentSpec: Customizable runtime enforcement for safe and reliable LLM agents," in Proc. IEEE/ACM 48th Int. Conf. Software Engineering (ICSE ''26), Apr. 2026, pp. 2938-2950, doi: 10.1145/3744916.3764546.'
  url: https://doi.org/10.1145/3744916.3764546
  track: defenses
  summary: A DSL whose rules combine a trigger (state_change, before_action, agent_finish), predicates, and enforcement (user_inspection, llm_self_examine, invoke_action, stop). The main implementation is on LangChain, and the design is described as framework-agnostic. The abstract reports preventing over 90% of unsafe code-agent executions with millisecond overhead, and o1-generated rules at 95.56% precision and 70.96% recall for embodied agents.
  relevance: Shows that a trigger-predicate-enforce engine with human inspection is practical. Mirsad adds taint/data-flow awareness, MCP-level interception, and audit.
- key: wang2026mcptox
  ieee: 'Z. Wang, Y. Gao, Y. Wang, S. Liu, H. Sun, H. Cheng, G. Shi, H. Du, and X. Li, "MCPTox: A benchmark for tool poisoning on real-world MCP servers," in Proc. AAAI Conf. Artif. Intell., vol. 40, no. 42, 2026, pp. 35811-35819, doi: 10.1609/aaai.v40i42.40895.'
  url: https://ojs.aaai.org/index.php/AAAI/article/view/40895
  track: attacks-benchmarks
  summary: Tool-poisoning benchmark on 45 live MCP servers and 353 tools, with 1,348 malicious cases in 10 risk categories. Harm is executed via legitimate tools. Across 20 agents, o1-mini reached 72.8% ASR, more capable models were often more vulnerable, and refusals stayed under 3%.
  relevance: Benchmark for Mirsad's metadata scanning. Because harm flows through legitimate tools, per-parameter policy on those tools is essential.
- key: willison2022prompt
  ieee: 'S. Willison, "Prompt injection attacks against GPT-3," Simon Willison''s Weblog, Sep. 12, 2022. Accessed: Oct. 11, 2026. [Online]. Available: https://simonwillison.net/2022/Sep/12/prompt-injection/'
  url: https://simonwillison.net/2022/Sep/12/prompt-injection/
  track: attacks-benchmarks
  summary: Blog post that named 'prompt injection' after Riley Goodside's GPT-3 demonstration. It frames the attack as the LLM analogue of SQL injection and shows prompt leaking. It floats a parameterized-query-style fix with separate instruction and data channels but says it is unclear whether this is feasible; an April 2023 update calls it extremely difficult, if not impossible.
  relevance: 'Founding assumption for Mirsad: the model cannot separate data from instructions, so enforcement must happen outside the model at the tool boundary.'
- key: willison2024pivsjailbreak
  ieee: 'S. Willison, "Prompt injection and jailbreaking are not the same thing," Simon Willison''s Weblog, Mar. 5, 2024. [Online]. Available: https://simonwillison.net/2024/Mar/5/prompt-injection-jailbreaking/'
  url: https://simonwillison.net/2024/Mar/5/prompt-injection-jailbreaking/
  track: attacks-benchmarks
  summary: Distinguishes prompt injection (an attack on applications that concatenate untrusted input with trusted prompts) from jailbreaking (an attack on model safety filters). Argues that injection harm scales with the data and tools an app can reach, and warns against relying on jailbreak-trained filters to stop injection.
  relevance: Sets Mirsad's scope as an injection firewall, not content moderation, and tells the team to train the detector on injection data rather than jailbreak data.
- key: willison2025trifecta
  ieee: 'S. Willison, "The lethal trifecta for AI agents: private data, untrusted content, and external communication," Simon Willison''s Weblog, Jun. 16, 2025. Accessed: Oct. 11, 2026. [Online]. Available: https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/'
  url: https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/
  track: attacks-benchmarks
  summary: Argues that agents combining private-data access, exposure to untrusted content and external communication can be made to exfiltrate data. Notes that MCP encourages mixing tools so users can assemble this combination, and that '95%' guardrail detection is a failing grade. Points developers to design patterns that constrain agents after untrusted input, and tells end users to avoid the combination entirely.
  relevance: Mirsad's taint tracking puts this into practice by gating external-communication sinks once untrusted content has entered context.
- key: wu2024fsecure
  ieee: 'F. Wu, E. Cecchetti, and C. Xiao, "System-level defense against indirect prompt injection attacks: An information flow control perspective," arXiv:2409.19091, Sep. 2024.'
  url: https://arxiv.org/abs/2409.19091
  track: defenses
  summary: 'Proposes the ''f-secure'' LLM system: an LLM planner producing structured executable plans, a rule-based executor, and a security monitor that filters untrusted input out of planning, with formal models of the security guarantees and case-study and benchmark evaluation.'
  relevance: Gives Mirsad the IFC vocabulary (sources, sinks, integrity) and the rule that untrusted data must not choose consequential actions.
- key: wu2025isolategpt
  ieee: 'Y. Wu, F. Roesner, T. Kohno, N. Zhang, and U. Iqbal, "IsolateGPT: An execution isolation architecture for LLM-based agentic systems," in Proc. Network and Distributed System Security Symp. (NDSS), 2025, doi: 10.14722/ndss.2025.241131.'
  url: https://www.ndss-symposium.org/ndss-paper/isolategpt-an-execution-isolation-architecture-for-llm-based-agentic-systems/
  track: defenses
  summary: Hub-and-spoke isolation for LLM app ecosystems. The hub has a non-LLM operator, a planner, and memory. Each app runs in its own spoke with its own LLM and memory. Inter-app communication is mediated by the hub with user permission (permanent, session, or one-time), and irreversible actions need explicit consent. Across 1,598 attacks (20.2% success on the baseline), permission dialogs appeared in 7.6% of cases, all with warnings. Overhead is under 30% for 75.73% of queries.
  relevance: A model for Mirsad's approval screen (permission scope plus risk warning). Its out-of-scope intra-app injection is where Mirsad's taint rules help.
- key: xiang2026architecting
  ieee: 'C. Xiang et al., "Architecting secure AI agents: Perspectives on system-level defenses against indirect prompt injection attacks," arXiv:2603.30016, Mar. 2026.'
  url: https://arxiv.org/abs/2603.30016
  track: defenses
  summary: 'Position paper arguing that system-level defenses are the ''skeleton'' of agentic systems. Three positions: dynamic replanning and policy updates are often needed; learned models should make context-dependent security decisions only within designs that strictly constrain them; and personalization and human interaction are core for ambiguous cases. Also warns that benchmarks can create a false sense of utility and security.'
  relevance: 'A recent citation supporting Mirsad''s hybrid architecture: rules as the boundary, the detector as a signal, and human approval.'
- key: yang2024qwen25
  ieee: A. Yang et al. (Qwen Team), "Qwen2.5 technical report," arXiv:2412.15115, Dec. 2024.
  url: https://arxiv.org/abs/2412.15115
  track: multilingual-arabic-security-and-standards
  summary: Open-weight LLM family trained on 18T tokens. Reports Arabic AMMLU scores (72.44 for the 72B-Instruct model) and extends MGSM to Arabic.
  relevance: Candidate detector backbone and agent under test.
- key: yao2023react
  ieee: 'S. Yao, J. Zhao, D. Yu, N. Du, I. Shafran, K. Narasimhan, and Y. Cao, "ReAct: Synergizing reasoning and acting in language models," in Proc. 11th Int. Conf. Learn. Represent. (ICLR), Kigali, Rwanda, 2023.'
  url: https://arxiv.org/abs/2210.03629
  track: foundations
  summary: Interleaves reasoning traces with tool actions and observations. Overcomes hallucination and error propagation on HotpotQA and FEVER via a Wikipedia API, and beats imitation and RL baselines on ALFWorld and WebShop by 34 and 10 absolute points of success rate with 1-2 in-context examples.
  relevance: Defines the reason-act-observe loop Mirsad mediates. Every act is a policy check and every observation is a possible taint source.
- key: yi2025bipia
  ieee: 'J. Yi, Y. Xie, B. Zhu, E. Kiciman, G. Sun, X. Xie, and F. Wu, "Benchmarking and defending against indirect prompt injection attacks on large language models," in Proc. 31st ACM SIGKDD Conf. Knowl. Discov. Data Min. V.1 (KDD ''25), Toronto, ON, Canada, 2025, pp. 1809-1820, doi: 10.1145/3690624.3709179.'
  url: https://doi.org/10.1145/3690624.3709179
  track: attacks-benchmarks
  summary: BIPIA is presented as the first indirect-prompt-injection benchmark, covering email QA, web QA, table QA, summarization and code QA with text and code attacks. All 25 LLMs tested were vulnerable. Proposes black-box boundary-awareness/explicit-reminder defenses (border strings, in-context learning, multi-turn dialogue, datamarking) and a white-box special-token adversarial fine-tuning defense that reaches near-zero ASR.
  relevance: Mirsad can apply boundary marking and provenance tags to untrusted tool outputs (it cannot use the white-box defense). BIPIA's email and web content can serve as detector test material.
- key: yong2023lowresource
  ieee: 'Z.-X. Yong, C. Menghini, and S. H. Bach, "Low-resource languages jailbreak GPT-4," presented at the NeurIPS 2023 Workshop on Socially Responsible Language Modelling Research (SoLaR), 2023, arXiv:2310.02446. [Online]. Available: https://arxiv.org/abs/2310.02446'
  url: https://arxiv.org/abs/2310.02446
  track: multilingual-arabic-security-and-standards
  summary: Translating AdvBench harmful prompts into low-resource languages bypassed GPT-4 safety about 79% of the time. MSA Arabic, placed in the high-resource group, had only a 3.65% bypass rate.
  relevance: Shows that model-level refusals cannot be relied on when the language changes. Motivates a language-aware detector in front of tools.
- key: zaghouani2026arabicdialectsafety
  ieee: 'W. Zaghouani, M. R. Biswas, K. K. Aldous, and M. Bessghaier, "ArabicDialectSafety: A dialect-aware benchmark for Arabic content safety classification," in Findings Assoc. Comput. Linguistics: EMNLP 2026, to appear; arXiv:2608.01291, 2026. [Online]. Available: https://arxiv.org/abs/2608.01291'
  url: https://arxiv.org/abs/2608.01291
  track: multilingual-arabic-security-and-standards
  summary: 25,071 prompts in MSA plus 5 dialects with 7 harm categories. Fine-tuned MARBERTv2 reached macro-F1 0.95 (binary) and 0.90 (granular), beating prompted frontier LLMs.
  relevance: Evidence that a compact fine-tuned Arabic encoder suits Mirsad's detector.
- key: zaghouani2026dialectaware
  ieee: 'W. Zaghouani, "Toward dialect-aware safety evaluation for Arabic large language models," in Proc. 6th Workshop Trustworthy NLP (TrustNLP), San Diego, CA, USA, Jul. 2026, pp. 503–514, doi: 10.18653/v1/2026.trustnlp-main.37.'
  url: https://aclanthology.org/2026.trustnlp-main.37/
  track: multilingual-arabic-security-and-standards
  summary: Defines the Dialect Safety Gap, the DSG score, the Pairwise Dialect Inconsistency measure and the DASEP protocol. A probe found safety degrades with distance from MSA.
  relevance: Metrics for measuring detector fairness across dialects.
- key: zhan2024injecagent
  ieee: 'Q. Zhan, Z. Liang, Z. Ying, and D. Kang, "InjecAgent: Benchmarking indirect prompt injections in tool-integrated large language model agents," in Findings Assoc. Comput. Linguist.: ACL 2024, Bangkok, Thailand, Aug. 2024, pp. 10471-10506, doi: 10.18653/v1/2024.findings-acl.624.'
  url: https://aclanthology.org/2024.findings-acl.624/
  track: attacks-benchmarks
  summary: 1,054 test cases (17 user tools, 62 attacker tools) with pre-constructed tool responses. Attacks are either direct harm or two-step data stealing (extract, then transmit). Across 30 agents, ReAct GPT-4 was compromised 24% of the time, and an enhanced setting that prepends a fixed 'hacking prompt' raised this to 47%.
  relevance: The data-stealing pattern is exactly the source-to-sink flow Mirsad's taint tracking blocks. Direct-harm cases map to per-tool/per-parameter policy.
- key: zhan2025adaptive
  ieee: 'Q. Zhan, R. Fang, H. S. Panchal, and D. Kang, "Adaptive attacks break defenses against indirect prompt injection attacks on LLM agents," in Findings Assoc. Comput. Linguistics: NAACL 2025, Albuquerque, NM, USA, Apr. 2025, pp. 7116-7132, doi: 10.18653/v1/2025.findings-naacl.395.'
  url: https://aclanthology.org/2025.findings-naacl.395/
  track: defenses
  summary: Adaptive GCG variants (including multi-objective and two-stage) and AutoDAN bypass all 8 tested IPI defenses with over 50% ASR. The defenses are a fine-tuned detector, an LLM detector, a perplexity filter, instructional prevention, data prompt isolation, sandwich prevention, paraphrasing, and adversarial fine-tuning. Tested on InjecAgent with a prompted Vicuna-7B agent and a fine-tuned Llama3-8B agent. White-box, first-action only.
  relevance: Shows Mirsad's detector will be bypassed, so policy and taint must hold on their own. Mirsad should run an adaptive attack on its detector.
- key: zhang2025asb
  ieee: 'H. Zhang, J. Huang, K. Mei, Y. Yao, Z. Wang, C. Zhan, H. Wang, and Y. Zhang, "Agent Security Bench (ASB): Formalizing and benchmarking attacks and defenses in LLM-based agents," in Proc. 13th Int. Conf. Learn. Represent. (ICLR), 2025, arXiv:2410.02644.'
  url: https://arxiv.org/abs/2410.02644
  track: attacks-benchmarks
  summary: Benchmark with 10 scenarios, 10 agents, 400+ tools, 10 prompt-injection attacks, memory poisoning, a Plan-of-Thought backdoor, 4 mixed attacks and 11 defenses on 13 LLMs. The highest average ASR is 84.30%, and defenses have limited effectiveness. Introduces the Net Resilient Performance (NRP) utility-security metric.
  relevance: Shows attacks at multiple agent stages. Memory-write tools should be both taint sinks and taint sources in Mirsad.
- key: zhang2026msb
  ieee: 'D. Zhang, Z. Li, X. Luo, X. Liu, P. Li, and W. Xu, "MCP Security Bench (MSB): Benchmarking attacks against Model Context Protocol in LLM agents," in Proc. 14th Int. Conf. Learn. Represent. (ICLR), 2026, arXiv:2510.15994.'
  url: https://arxiv.org/abs/2510.15994
  track: attacks-benchmarks
  summary: End-to-end MCP attack benchmark with 12 attack types across planning, invocation and response handling (name collision, preference manipulation, description injection, out-of-scope parameters, user impersonation, false-error escalation, tool transfer, retrieval injection, mixed). Runs real tools over MCP with 9 agents, 10 domains, 405 tools and 2,000 instances. Reports an under-attack variant of ASB's Net Resilient Performance (NRP) metric.
  relevance: MCP-native evaluation for Mirsad alongside AgentDojo. NRP can serve as a headline metric, and name collisions motivate server-qualified tool identities in policy.
- key: zhu2025melon
  ieee: 'K. Zhu, X. Yang, J. Wang, W. Guo, and W. Y. Wang, "MELON: Provable defense against indirect prompt injection attacks in AI agents," in Proc. 42nd Int. Conf. Machine Learning (ICML), PMLR, vol. 267, 2025, pp. 80310-80329.'
  url: https://proceedings.mlr.press/v267/zhu25z.html
  track: defenses
  summary: 'Masked re-execution and tool comparison: it re-runs the trajectory with the user prompt masked and flags an attack when the original and masked runs produce similar actions. Three design elements reduce false positives and false negatives. Outperforms prior defenses on AgentDojo in both prevention and utility, and MELON-Aug improves further. Language-agnostic by design but not evaluated multilingually.'
  relevance: Possible language-independent second opinion before escalation. Nasr et al. reach 76% ASR (Llama-3.3-70B, no defense knowledge) and 95% with full knowledge, so it cannot be the gate.
- key: zou2025art
  ieee: 'A. Zou et al., "Security challenges in AI agent deployment: Insights from a large scale public competition," in Adv. Neural Inf. Process. Syst. 38 (NeurIPS 2025), Datasets and Benchmarks Track, 2025, pp. 88855-88891, doi: 10.52202/085713-2676.'
  url: https://papers.neurips.cc/paper_files/paper/2025/hash/73368bc7644c054b5bcc6490a8f2fb1c-Abstract-Datasets_and_Benchmarks_Track.html
  track: attacks-benchmarks
  summary: Public red-teaming competition against agents powered by 22 frontier LLMs in 44 scenarios. Of 1.8M injection attempts, more than 60k caused policy violations. It produced the ART benchmark, evaluated on 19 models in the arXiv version. Nearly all agents violated policy within 10-100 queries, attacks transferred across models, and robustness correlated weakly with size, capability or compute.
  relevance: The violated deployment policies are what Mirsad encodes declaratively. Fast attacker success motivates audit-log monitoring of repeated attempts.
- key: hevner2004design
  ieee: 'A. R. Hevner, S. T. March, J. Park, and S. Ram, "Design science in information systems research," MIS Quarterly, vol. 28, no. 1, pp. 75–105, Mar. 2004, doi: 10.2307/25148625.'
  url: https://doi.org/10.2307/25148625
  track: foundations
  summary: Guidelines for design-science research in information systems, in which an IT artefact is built to address an organisational problem and then evaluated rigorously.
  relevance: Methodological basis of the project approach in Section 3.1.
- key: acm2018code
  ieee: 'Association for Computing Machinery, ACM Code of Ethics and Professional Conduct. New York, NY, USA: ACM, Jun. 2018.'
  url: https://www.acm.org/code-of-ethics
  track: foundations
  summary: Professional code of the ACM, adopted in 2018, covering general ethical principles, professional responsibilities and leadership principles.
  relevance: Professional code cited in Section 3.6.5.
