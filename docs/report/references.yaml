  track: defenses
  summary: Fixes SecAlign's utility loss on agentic tasks with randomized injection positions and self-generated training labels. Keeps almost all undefended utility while improving security over SecAlign against static and GCG adaptive attacks. Evaluated on Llama-3.1-8B, Llama-3.3-70B, Llama-4-Scout, Qwen3-4B, and Qwen3.6-27B across six benchmarks including AgentDojo, InjecAgent, WASP, and SEP.
