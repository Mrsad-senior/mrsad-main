  - {id: M2, name: "Architecture & policy language approved", date: 2026-11-15, objective: "O1, O2"}
  - {id: M3, name: "Prototype intercepts MCP traffic with policies", date: 2026-12-20, objective: "O1, O2"}
  - {id: M4, name: "Taint tracking & detector integrated", date: 2027-02-20, objective: "O3, O4"}
  - {id: M5, name: "Approval app, dashboard & audit complete", date: 2027-03-20, objective: "O5"}
  - {id: M6, name: "Benchmark & security testing complete", date: 2027-04-20, objective: "O6"}
  - {id: M7, name: "Final submission & presentation", date: 2027-05-20, objective: "All"}
