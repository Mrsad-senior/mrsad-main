# Upstream tool servers that Mirsad proxies. Tools are exposed to agents only if the active policy allows them.
upstreams:
  # Simulated Najd Trading Co. workspace (email, CRM, web, documents, payments), loaded in-process.
  - name: workspace
    transport: inprocess
    target: demo.workspace_server:server

  # Example: an MCP server started as a subprocess over stdio.
